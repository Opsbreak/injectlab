[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "injectlab"
version = "0.1.0"
description = "Indirect prompt-injection test harness for tool-using LLM agents and RAG apps"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Opsbreak Inc.", email = "admin@opsbreak.com" }]
keywords = ["llm", "security", "prompt-injection", "red-team", "agents", "rag", "testing"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Testing",
    "Typing :: Typed",
]
dependencies = ["PyYAML>=6.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
injectlab = "injectlab.cli:main"

[project.urls]
Homepage = "https://github.com/Opsbreak/injectlab"
Issues = "https://github.com/Opsbreak/injectlab/issues"
Changelog = "https://github.com/Opsbreak/injectlab/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/injectlab"]

# Ship the bundled suite inside the wheel so `injectlab run` works without a checkout.
[tool.hatch.build.targets.wheel.force-include]
"scenarios" = "injectlab/_suite/scenarios"
"payloads" = "injectlab/_suite/payloads"

[tool.hatch.build.targets.sdist]
include = ["src", "scenarios", "payloads", "tests", "README.md", "LICENSE", "CHANGELOG.md", "SECURITY.md", "CONTRIBUTING.md"]

[tool.ruff]
line-length = 110
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "C4", "PIE", "PT", "RET"]
ignore = [
    "E501",   # `ruff format` enforces line length; long string literals (embedded report JS/CSS) are allowed
    "RUF001", # ambiguous unicode characters are the point of homoglyph/zero-width tests
    "RUF002",
    "RUF003",
    "RUF012",
    "SIM108",
    "RET504",
    "PT011",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PT018"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
