name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install -e ".[dev]"

      - name: Lint
        run: |
          ruff check src tests
          ruff format --check src tests

      - name: Validate bundled scenarios and payloads
        run: injectlab validate

      - name: Tests
        run: pytest -q

      - name: Smoke run against the mock targets
        run: |
          injectlab run --target mock:guarded --mutators b64,zwsp,homoglyph --out results/guarded -q --fail-on-asr 0.25
          injectlab run --target mock:naive --mutators b64,zwsp,homoglyph --out results/naive -q
          # The gate must catch the vulnerable model as a regression against the defended one ...
          if injectlab compare results/guarded results/naive; then
            echo "::error::compare did not flag the naive model as a regression"
            exit 1
          fi
          # ... and must pass when nothing changed.
          injectlab compare results/guarded results/guarded

      - name: Upload smoke-run reports
        if: always() && matrix.python-version == '3.13'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: injectlab-smoke-reports
          path: results/*/report.html
          if-no-files-found: ignore
